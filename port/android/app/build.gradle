plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// a build of main knows its number (tools/ci_build.py), which names its
// release and which the self-updater (Updater.java) compares; others have
// none and never look for updates
def buildNumberText = System.getenv("HALO_BUILD_NUMBER") ?: "0"
def buildNumber = buildNumberText.isInteger() ? buildNumberText.toInteger() : 0

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")
// Manually scoped test builds are a separate, updatable app. The normal
// package remains unchanged when this environment flag is absent.
def experimentalPackage = System.getenv("HALO_ANDROID_EXPERIMENT_PACKAGE") == "true"
if (experimentalPackage && (!signingKey ||
    !System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD"))) {
    throw new GradleException("Halo Experiment builds require permanent signing credentials")
}

// Test APKs are not numbered by CI (HALO_BUILD_NUMBER=0), but Android
// requires a higher versionCode to update an installed app. Give each
// locally signed test build an increasing code without enabling the
// public-release updater, which uses HALO_BUILD_NUMBER.
def testVersionCodeText = System.getenv("HALO_ANDROID_VERSION_CODE")
def androidVersionCode = Math.max(1, buildNumber)
if (testVersionCodeText) {
    if (!testVersionCodeText.isInteger() ||
        testVersionCodeText.toInteger() < 1 ||
        testVersionCodeText.toInteger() > 2100000000) {
        throw new GradleException("HALO_ANDROID_VERSION_CODE must be an integer from 1 to 2100000000")
    }
    if (!signingKey || !System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")) {
        throw new GradleException("Update test builds require HALO_ANDROID_KEYSTORE and HALO_ANDROID_KEYSTORE_PASSWORD")
    }
    androidVersionCode = testVersionCodeText.toInteger()
}

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        applicationId experimentalPackage ? "com.halo.decomp.experiment" : "com.halo.decomp"
        manifestPlaceholders = [
            haloAppLabel: experimentalPackage ? "Halo Experiment" : "Halo",
            haloUpdateAuthority: experimentalPackage ?
                "com.halo.decomp.experiment.update" : "com.halo.decomp.update"
        ]
        minSdk 28
        targetSdk 35
        versionCode androidVersionCode
        versionName buildNumber > 0 ? "build " + buildNumber :
            (testVersionCodeText ? "test " + androidVersionCode : "1.0")
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
