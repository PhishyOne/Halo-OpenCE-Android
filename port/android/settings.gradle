// Gradle project of the Android port; the native parts are built by
// `ninja android` from the repository root (see README.md here).
pluginManagement {
    repositories {
        google()
        // Google's public Maven Central mirror avoids GitHub-hosted
        // runners sharing Maven Central's temporary HTTP 429 limit.
        // Retain the canonical repository as an explicit fallback.
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
    }
}
rootProject.name = "halo-android"
include ":app"
