name: Playlist touch verification
on:
  push:
    branches: [halo/v77-touch-check]
permissions:
  contents: read
jobs:
  android-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise the release card with Android touch events
        run: |
          mkdir -p "$RUNNER_TEMP/playlist-test/app/src/main/java/com/halo/decomp" "$RUNNER_TEMP/playlist-test/app/src/test/java/com/halo/decomp"
          qa="$RUNNER_TEMP/playlist-test"
          cp port/android/{settings.gradle,build.gradle,gradlew} "$qa/"
          cp -R port/android/gradle "$qa/"
          cp port/android/app/src/main/java/com/halo/decomp/PlaylistCards.java "$qa/app/src/main/java/com/halo/decomp/"
          cp tools/lan/PlaylistCardsGestureTest.java "$qa/app/src/test/java/com/halo/decomp/"
          echo 'android.useAndroidX=true' > "$qa/gradle.properties"
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application/></manifest>' > "$qa/app/src/main/AndroidManifest.xml"
          cat > "$qa/app/build.gradle" <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.halo.decomp'
              compileSdk 35
              defaultConfig { applicationId 'com.halo.playlist.test'; minSdk 28; targetSdk 33 }
              testOptions.unitTests.includeAndroidResources = true
          }
          dependencies {
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.robolectric:robolectric:4.14.1'
          }
          tasks.withType(Test).configureEach {
              systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
              testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
          }
          GRADLE
          cd "$qa"
          ./gradlew --console=plain --no-daemon :app:testDebugUnitTest
