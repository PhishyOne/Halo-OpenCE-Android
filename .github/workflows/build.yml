name: Build
on:
  push:
    branches: [halo/android-build-v77]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  android:
    # The runner image has the Android SDK and NDK, a JDK and CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HALO_ANDROID_VERSION_CODE: '77'
      HALO_ANDROID_EXPERIMENT_PACKAGE: 'true'
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          # (each download checked against the hash it had when it was pinned)
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: f233974bf7e1135525482f7a4c5839472dd6dbe9

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      # When musl.libc.org times out on GitHub runners, Debian's upstream
      # tarball supplies the exact byte-identical pinned musl 1.2.5 source.
      # Verify SHA-256 before extraction; do not change the pinned version.
      - name: Restore pinned musl source from verified mirror
        if: ${{ true }}
        run: |
          if [ ! -f build/android/third_party/musl-1.2.5/include/stdio.h ]; then
            mkdir -p build/android/third_party
            curl -fL --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 90 -o "$RUNNER_TEMP/musl-1.2.5.tar.gz" https://deb.debian.org/debian/pool/main/m/musl/musl_1.2.5.orig.tar.gz
            printf '%s\n' "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  $RUNNER_TEMP/musl-1.2.5.tar.gz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/musl-1.2.5.tar.gz" -C build/android/third_party
            rm "$RUNNER_TEMP/musl-1.2.5.tar.gz"
            test -f build/android/third_party/musl-1.2.5/include/stdio.h
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('port/android/**/*.gradle*', 'port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # the app's signing key, from the ANDROID_KEYSTORE_BASE64 secret (a
      # keystore, base64) and ANDROID_KEYSTORE_PASSWORD (its password, and
      # the key's, alias halo): every build signed with it installs over the
      # one before, as the app's self-updater (Updater.java) needs. Without
      # them each build is signed with the runner's own debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the Android builds cannot update over each other"
          fi

      - name: Debug
        if: ${{ false }}
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/ci_build.py android debug

      # Source-only objective policy and launcher checks run before
      # expensive native compilation when the isolated build is selected.
      - name: Test bot objectives and Android launcher
        if: ${{ true }}
        run: |
          python3 tools/test_bot_objective_policy.py -v
          python3 tools/test_all_multiplayer_modes.py -v
          python3 tools/test_bot_vehicle_flip.py
          python3 tools/test_bot_vehicle_driving.py -v
          python3 tools/test_bot_vehicle_crews.py -v
          python3 tools/test_bot_vehicle_visibility.py -v
          python3 tools/test_ce_tag_aliases.py -v
          python3 tools/test_bot_garbage_policy.py -v
          python3 tools/test_lobby_bot_count.py -v
          python3 tools/test_lan_64_bot_capacity.py -v
          python3 tools/test_commander_feature_policy.py -v
          python3 tools/test_commander_tactical.py -v
          python3 tools/test_commander_roles.py -v
          python3 tools/test_killstreak_rewards.py -v
          python3 tools/test_killstreak_recon.py -v
          python3 tools/test_killstreak_orbital.py -v
          python3 tools/test_breach_stock_vfx.py -v
          python3 tools/test_bot_target_performance.py
          python3 tools/test_bot_automatic_modes.py -v
          python3 tools/test_coop_unit_resync.py -v
          python3 tools/test_android_launcher_layout.py -v
          python3 tools/test_lan_discovery_launcher.py -v
          python3 tools/test_career_records_v37.py -v
          python3 tools/test_career_native_v37.py -v
          python3 -m unittest tools.test_career_results tools.test_background_session -v
          python3 tools/test_v38_launcher_phantom.py -v
          python3 tools/test_v39_visual_design.py -v
          python3 tools/test_v40_rank_and_icon.py -v
          python3 tools/test_v41_admin_profile_history.py -v
          python3 tools/test_v50_match_history_ui.py -v
          python3 tools/test_v51_video_reels.py -v
          python3 tools/test_v52_achievement_details.py -v
          python3 tools/test_v53_lan_rating_board.py -v
          python3 tools/test_v54_video_diagnostics.py -v
          python3 tools/test_v55_video_playback.py -v
          python3 tools/test_v56_video_storage.py -v
          python3 tools/test_v57_match_video.py -v
          python3 tools/test_v58_live_peers.py -v
          python3 tools/test_v59_social_hub.py -v
          python3 tools/test_v60_theme_privacy.py -v
          python3 tools/test_v61_flat_launcher.py -v
          python3 -m unittest tools.test_group_rating_native -v
          python3 -m unittest tools.test_sticks_and_stones -v
          python3 -m unittest tools.test_vip -v
          python3 -m unittest tools.test_v65_compact_launcher -v
          python3 -m unittest tools.test_v66_play_dock -v
          python3 -m unittest tools.test_v67_simple_tools -v
          python3 -m unittest tools.test_v68_original_title -v
          python3 -m unittest tools.test_v70_launcher_polish -v
          python3 -m unittest tools.test_v71_native_title -v
          python3 -m unittest tools.test_v73_direct_match -v
          python3 -m unittest tools.test_v73_unified_lobby -v
          python3 -m unittest tools.test_v73_native_rules -v
          python3 tools/test_highlight_moments.py -v
          python3 tools/test_v42_highlights_integration.py -v
          python3 tools/test_android_experiment_package.py -v
          python3 tools/test_lan_apk_update.py -v
          python3 tools/test_campaign_save_backup.py -v
          python3 tools/test_campaign_map_transfer.py -v
          mkdir -p "$RUNNER_TEMP/halo-test-classes"
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LauncherMatch.java \
            port/android/app/src/main/java/com/halo/decomp/MatchWorkshop.java \
            port/android/app/src/main/java/com/halo/decomp/NativeMatchRules.java \
            tools/lan/LauncherMatchTest.java tools/lan/NativeMatchRulesTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LauncherMatchTest
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.NativeMatchRulesTest
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/MatchWorkshop.java \
            port/android/app/src/main/java/com/halo/decomp/LobbyModel.java \
            port/android/app/src/main/java/com/halo/decomp/LobbyName.java \
            port/android/app/src/main/java/com/halo/decomp/LobbyWire.java \
            tools/lan/MatchWorkshopTest.java tools/lan/LobbyModelTest.java tools/lan/LobbyStartTest.java tools/lan/LobbyPlaylistTest.java
          javac -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/StockMapPictures.java port/android/app/src/main/java/com/halo/decomp/CeMapOverview.java tools/lan/MapPicturesTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.MapPicturesTest
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.MatchWorkshopTest
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LobbyModelTest
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LobbyStartTest
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LobbyPlaylistTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanUpdateProtocol.java \
            port/android/app/src/main/java/com/halo/decomp/CustomMapImporter.java \
            port/android/app/src/main/java/com/halo/decomp/NativeLobbyMatch.java tools/lan/LobbyHandoffTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LobbyHandoffTest
          python3 -m unittest tools.test_v74_lobby_handoff -v
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/TitleBackdropFiles.java \
            tools/lan/TitleBackdropFilesTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.TitleBackdropFilesTest
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/PlayDockPolicy.java \
            tools/lan/PlayDockPolicyTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.PlayDockPolicyTest
          # Pure JDK checks: portable Xbox save backup/restore, rollback,
          # safe ZIP paths, duplicate entries, truncated and oversized files.
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/CampaignSaveArchive.java \
            tools/lan/CampaignSaveArchiveTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CampaignSaveArchiveTest
          # Host/guest update wire, subnet and fixed-route tests without Android.
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanUpdateProtocol.java \
            port/android/app/src/main/java/com/halo/decomp/LanUpdateSocket.java \
            tools/lan/LanUpdateProtocolTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanUpdateProtocolTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanDiscoveryProtocol.java \
            port/android/app/src/main/java/com/halo/decomp/LobbyName.java \
            tools/lan/LanDiscoveryProtocolTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanDiscoveryProtocolTest
          # Persistent local career journal, deduplication, XP and achievements.
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/CareerRecords.java \
            tools/lan/CareerRecordsTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CareerRecordsTest
          # Pure-JDK peer-to-peer leaderboard and provisional rating tests:
          # scores, id dedup, nonce framing, stale replies and bounded writes.
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanRating.java \
            port/android/app/src/main/java/com/halo/decomp/LanBoardProtocol.java \
            port/android/app/src/main/java/com/halo/decomp/LanBoardStore.java \
            port/android/app/src/main/java/com/halo/decomp/LanBoardDiscovery.java \
            tools/lan/LanBoardCoreTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanBoardCoreTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanBoardPresence.java \
            tools/lan/LanBoardPresenceTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanBoardPresenceTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanBoardAutoSync.java \
            port/android/app/src/main/java/com/halo/decomp/LanShareState.java \
            port/android/app/src/main/java/com/halo/decomp/LanReelProtocol.java \
            port/android/app/src/main/java/com/halo/decomp/LanReelBuffer.java \
            tools/lan/LanSocialHubTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanSocialHubTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/VideoFrameBrightness.java \
            tools/lan/VideoFrameBrightnessTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.VideoFrameBrightnessTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/MatchHistoryModel.java \
            tools/lan/MatchHistoryModelTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.MatchHistoryModelTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" tools/lan/CareerExitTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CareerExitTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/MatchHighlights.java \
            tools/lan/MatchHighlightsTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.MatchHighlightsTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/ReelSessionIndex.java \
            tools/lan/ReelSessionIndexTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.ReelSessionIndexTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/HaloVideoFiles.java \
            tools/lan/HaloVideoFilesTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.HaloVideoFilesTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" tools/lan/HaloVideoDeletionTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.HaloVideoDeletionTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/MatchVideoState.java \
            port/android/app/src/main/java/com/halo/decomp/MatchVideoTimeline.java \
            tools/lan/MatchVideoTimelineTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.MatchVideoTimelineTest
          javac -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanConfig.java \
            tools/lan/LanConfigSmokeTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanConfigSmokeTest
          javac -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/SidewinderRepair.java tools/lan/SidewinderRepairTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.SidewinderRepairTest
          # Original Xbox campaign maps are not Custom Edition map shares.
          # Validate fixed-ID repair, private document export, rollback and
          # corrupted/missing missions on a pure-JDK fixture before release.
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/CampaignMapTransfer.java \
            port/android/app/src/main/java/com/halo/decomp/CampaignAdminArchive.java \
            tools/lan/CampaignMapTransferTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CampaignMapTransferTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/CampaignRepairImport.java \
            tools/lan/CampaignRepairImportTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CampaignRepairImportTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/LanMapTransfer.java \
            port/android/app/src/main/java/com/halo/decomp/LanMapServer.java \
            port/android/app/src/main/java/com/halo/decomp/LanCustomMapTransfer.java \
            port/android/app/src/main/java/com/halo/decomp/CustomMapImporter.java \
            tools/lan/LanMapTransferTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.LanMapTransferTest
          javac -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/CustomMapImporter.java tools/lan/CustomMapImporterTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CustomMapImporterTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/CustomMapPack.java tools/lan/CustomMapPackTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CustomMapPackTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" \
            port/android/app/src/main/java/com/halo/decomp/UnifiedMapImport.java \
            tools/lan/UnifiedMapToolsTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.UnifiedMapToolsTest
          javac -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/OfflineBotConfig.java tools/lan/OfflineBotConfigTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.OfflineBotConfigTest
          # Validate actual CE map resource references with strict bounds,
          # using the pure-Java production diagnostic (no game assets needed).
          javac -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/CeResourceAudit.java tools/lan/CeResourceAuditTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CeResourceAuditTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/HaloDiagnostics.java tools/lan/HaloDiagnosticsTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.HaloDiagnosticsTest
          javac -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/CommanderConfig.java tools/lan/CommanderConfigTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.CommanderConfigTest
          javac -cp "$RUNNER_TEMP/halo-test-classes" -d "$RUNNER_TEMP/halo-test-classes" port/android/app/src/main/java/com/halo/decomp/KillstreakConfig.java tools/lan/KillstreakConfigTest.java tools/lan/IndependentModesTest.java
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.KillstreakConfigTest
          java -cp "$RUNNER_TEMP/halo-test-classes" com.halo.decomp.IndependentModesTest

      - name: Release
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tools/ci_build.py android release

      - name: Verify packaged native-menu fonts and game image
        if: ${{ true }}
        run: |
          python3 tools/verify_android_ui_assets.py dist/halo-android-release/app-release.apk
          python3 tools/verify_android_icon_v40.py dist/halo-android-release/app-release.apk

      # the touch controls' layout and gyroscope maths (the runner's JDK)
      - name: Test the touch layout
        run: python3 tools/test_touch_layout.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        if: ${{ false }}
        with:
          name: halo-android-debug
          path: dist/halo-android-debug
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: halo-android-release
          path: dist/halo-android-release
          retention-days: 3

