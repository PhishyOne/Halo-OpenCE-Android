name: Halo Royale landing verification
on:
  push:
    branches: [halo/royale-landing-check]
concurrency:
  group: halo-royale-landing
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    # The runner image has the Android SDK and NDK, a JDK and CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          # (each download checked against the hash it had when it was pinned)
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'EOF'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          EOF
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: a997d64140a53db9e264c270509bd011f07ca33c

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      # musl and SDL, which configure.py fetches
      - uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: android-third-party-${{ hashFiles('tools/android_build.py', 'port/android/patches/**') }}

      # When musl.libc.org times out on GitHub runners, Debian's upstream
      # tarball supplies the exact byte-identical pinned musl 1.2.5 source.
      # Verify SHA-256 before extraction; do not change the pinned version.
      - name: Restore pinned musl source from verified mirror
        run: |
          if [ ! -f build/android/third_party/musl-1.2.5/include/stdio.h ]; then
            mkdir -p build/android/third_party
            curl -fL --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 90 -o "$RUNNER_TEMP/musl-1.2.5.tar.gz" https://deb.debian.org/debian/pool/main/m/musl/musl_1.2.5.orig.tar.gz
            printf '%s\n' "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  $RUNNER_TEMP/musl-1.2.5.tar.gz" | sha256sum -c -
            tar xzf "$RUNNER_TEMP/musl-1.2.5.tar.gz" -C build/android/third_party
            rm "$RUNNER_TEMP/musl-1.2.5.tar.gz"
            test -f build/android/third_party/musl-1.2.5/include/stdio.h
          fi

      - name: Build Android native runtime
        run: python3 configure.py --release --pgo=off --lto=off && ninja android
  web:
    # Emscripten (emsdk, the version below, cached) builds the web port's
    # site (port/web/README.md); the tests check its graph, the page's
    # importer and service worker, its sockets, that it starts in a
    # headless Chromium (with no game data, as far as the menus' map), and
    # that two browsers join a room through a local MQTT broker.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a997d64140a53db9e264c270509bd011f07ca33c

      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/halo_sdl3.py') }}

      - name: Install the toolchain
        run: |
          if [ ! -x ~/emsdk/upstream/emscripten/emcc ]; then
            rm -rf ~/emsdk
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
            ~/emsdk/emsdk install "$EMSDK_VERSION"
          fi
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache python3-pytest mosquitto

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      - name: Build web runtime
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 configure.py --release --pgo=off --lto=off
          ninja web
  footprint:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install Linux tools
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed git python python-pytest ninja clang lld gcc lib32-glibc lib32-gcc-libs sdl3 lib32-sdl3
      - uses: actions/checkout@v4
        with:
          ref: a997d64140a53db9e264c270509bd011f07ca33c
      - name: Build native engine and validator
        run: |
          python configure.py --release --lto=off --pgo=off
          ninja -j4 linux > /tmp/royale-build.log 2>&1 || { tail -100 /tmp/royale-build.log; exit 1; }
      - name: Run collision, movement, regression and round tests
        run: |
          export HALO_GAME="$(pwd)/build/linux/halo"
          python -m pytest -v -s --basetemp=/tmp/royale-play tools/stagekit/tests tools/test_battle_royale_round.py
      - name: Show validation details
        if: always()
        run: |
          f=$(find /tmp/royale-play -path '*crossroads*/custom_maps/void.map' | head -1)
          if test -n "$f"; then build/linux/map_validate "$f"; fi
      - name: Retain footprint and engine evidence
        if: always()
        run: |
          mkdir -p footprint-evidence
          find /tmp/royale-play -path '*royale_crossroads*' -type f \( -name 'void.map' -o -name 'game.log' -o -name 'debug.txt' \) | while IFS= read -r f; do
            dest="footprint-evidence/${f#/tmp/royale-play/}"
            mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: royale-footprint-evidence
          path: footprint-evidence
          retention-days: 7
